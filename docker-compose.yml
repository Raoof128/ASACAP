version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/backend:/app

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./services/frontend/webapp/src:/app/src
